services:
  dashboard:
    build: .
    container_name: privatdashboard
    restart: unless-stopped
    # Synology: Container unter dem NAS-Benutzer laufen lassen, damit ./data schreibbar ist
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HOST_PORT:-8090}:3000"
    env_file: .env
    volumes:
      - ./data:/data
      - ./uploads:/uploads
